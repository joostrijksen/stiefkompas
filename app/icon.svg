<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient achtergrond -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17B3B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C4B9A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Achtergrond met afgeronde hoeken -->
  <rect width="512" height="512" rx="96" fill="url(#bg-gradient)"/>
  
  <!-- SK tekst -->
  <text 
    x="256" 
    y="350" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="280" 
    font-weight="700" 
    fill="white" 
    text-anchor="middle">SK</text>
</svg>
